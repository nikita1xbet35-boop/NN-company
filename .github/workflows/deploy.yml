name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        working-directory: mini-app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Get org ID (user ID for personal accounts)
          ORG_ID=$(curl -s "https://api.vercel.com/v2/user" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['user']['id'])")

          # Get project ID
          PROJECT_ID=$(curl -s "https://api.vercel.com/v9/projects?limit=20" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for p in data.get('projects', []):
            if 'nn-company' in p.get('name','').lower():
              print(p['id']); break
          ")

          echo "Org: $ORG_ID  Project: $PROJECT_ID"
          VERCEL_ORG_ID=$ORG_ID VERCEL_PROJECT_ID=$PROJECT_ID \
            vercel --prod --token=$VERCEL_TOKEN --yes
