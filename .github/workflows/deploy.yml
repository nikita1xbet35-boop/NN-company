name: Deploy to Vercel

on:
  push:
    branches: [claude/telegram-mini-app-crm-j0jme]
  workflow_dispatch:

env:
  VERCEL_ORG_ID:     Ba6v97eyJ8FzoI1hh1oPchnN
  VERCEL_PROJECT_ID: prj_Eka47eKPNI0oYW72OaNmI7EAgVK4
  VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mini-app/package-lock.json

      - name: Install dependencies
        working-directory: mini-app
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull project settings
        working-directory: mini-app
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (local)
        working-directory: mini-app
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt
        working-directory: mini-app
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
