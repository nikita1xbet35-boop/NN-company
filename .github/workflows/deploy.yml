name: Deploy to Vercel

on:
  push:
    branches: [claude/telegram-mini-app-crm-j0jme]
  workflow_dispatch:

env:
  VERCEL_ORG_ID:     Ba6v97eyJ8FzoI1hh1oPchnN
  VERCEL_PROJECT_ID: prj_Eka47eKPNI0oYW72OaNmI7EAgVK4

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Vercel deployment via API
        run: |
          RESPONSE=$(curl -sS -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"nn-company\",
              \"target\": \"production\",
              \"projectId\": \"${{ env.VERCEL_PROJECT_ID }}\",
              \"gitSource\": {
                \"type\": \"github\",
                \"org\": \"nikita1xbet35-boop\",
                \"repo\": \"NN-company\",
                \"ref\": \"${{ github.sha }}\"
              }
            }")
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          url = d.get('url','')
          state = d.get('readyState', d.get('status',''))
          err = d.get('error', {})
          if err:
            print('ERROR:', err.get('message', d))
            sys.exit(1)
          print('Deployment ID:', d.get('id','N/A'))
          print('URL:', url)
          print('State:', state)
          " || (echo "$RESPONSE" && exit 1)
