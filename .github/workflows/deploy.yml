name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Find Vercel project & deploy
        working-directory: mini-app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Find project ID from Vercel API
          PROJECT_ID=$(curl -sf "https://api.vercel.com/v9/projects?limit=100" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for p in data.get('projects', []):
            if 'nn-company' in p.get('name','').lower():
              print(p['id']); break
          ")

          echo "Deploying project: $PROJECT_ID"
          VERCEL_PROJECT_ID=$PROJECT_ID vercel --prod --token=$VERCEL_TOKEN --yes
