<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f0f13" />
    <title>NN Company CRM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:#0f0f13;font-family:system-ui,sans-serif}
      #splash{
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;
        background:#0f0f13;color:#6b7280;z-index:9999;
      }
      .spin{
        width:40px;height:40px;border-radius:50%;
        border:3px solid #252535;border-top-color:#6366f1;
        animation:spin .8s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="spin"></div>
      <span style="font-size:13px">Загрузка CRM...</span>
    </div>
    <div id="root"></div>
    <script>
      // Remove splash when React is ready, or after 8s fallback
      window.__ready = function(){
        var s = document.getElementById('splash');
        if(s) s.style.display = 'none';
      }
      setTimeout(window.__ready, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
